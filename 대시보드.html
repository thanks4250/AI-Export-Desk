<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Export Desk</title>
<!--
  AI에게: 이 파일은 손으로 고치지 않는다. 폴더 맨 위에서 python "장부/대시보드 갱신.py" 를 실행하면 맨 아래 데이터 칸만 다시 쓰인다(AGENTS.md 9절).
  스타일·화면 구조·기능 코드는 그대로 둔다. 이 화면은 보기 전용이다 — 일은 채팅에서 받는다.
-->
<style>
  :root{
    --bg:#f4f5f7;--card:#fff;--ink:#1b2230;--muted:#667080;--line:#e1e4e9;--soft:#eef1f4;--side:#fbfcfd;
    --accent:#0f6e6e;--accent-ink:#fff;--accent-soft:#e2f2f1;
    --warn:#a85308;--warn-soft:#fff2df;--bad:#b42318;--ok:#1f7a45;--ok-soft:#e4f4e9;
    --a:#1f7a45;--b:#a86a00;--c:#7a8391;--sw:208px;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#11151b;--card:#1a2028;--ink:#e6e9ed;--muted:#99a2ad;--line:#2a323c;--soft:#212932;--side:#151a21;
    --accent:#53b8b4;--accent-ink:#0c1317;--accent-soft:#17312f;
    --warn:#f0a35a;--warn-soft:#2b2316;--bad:#ff8a80;--ok:#6fcf97;--ok-soft:#163022;
    --a:#6fcf97;--b:#f0b85a;--c:#99a2ad;
  }}
  :root[data-theme="dark"]{
    --bg:#11151b;--card:#1a2028;--ink:#e6e9ed;--muted:#99a2ad;--line:#2a323c;--soft:#212932;--side:#151a21;
    --accent:#53b8b4;--accent-ink:#0c1317;--accent-soft:#17312f;
    --warn:#f0a35a;--warn-soft:#2b2316;--bad:#ff8a80;--ok:#6fcf97;--ok-soft:#163022;
    --a:#6fcf97;--b:#f0b85a;--c:#99a2ad;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  button{font:inherit;color:inherit}
  a{color:var(--accent)}
  /* 채팅이 왼쪽에 있으므로 메뉴는 오른쪽 */
  .app{display:flex;flex-direction:row-reverse;min-height:100vh}
  .side{flex:none;width:208px;background:var(--side);border-left:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:10px 8px}
  .side .brand{display:flex;align-items:center;gap:8px;padding:4px 6px 12px}
  .side .brand b{font-size:14px;line-height:1.3}
  .side .brand small{display:block;color:var(--muted);font-size:12px;font-weight:400}
  .tog{border:0;background:transparent;cursor:pointer;font-size:18px;padding:2px 6px;border-radius:6px;color:var(--muted)}
  .tog:hover{background:var(--soft)}
  .nav{list-style:none;margin:0;padding:0}
  .nav button,.sidebtn{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:9px;padding:8px 10px;cursor:pointer;text-align:left;font-size:14px}
  .nav button:hover,.sidebtn:hover{background:var(--soft)}
  .nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
  .ic{width:22px;text-align:center;font-size:17px;flex:none}
  .nav .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
  .nav .sep{border-top:1px solid var(--line);margin:8px 6px}
  .side .foot{margin-top:auto}
  .mini .side{width:58px}
  .mini .side .lbl,.mini .side .cnt,.mini .side .brand .bt{display:none}
  .mini .side .brand{justify-content:center}
  .wide .side{display:none}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 20px}
  .top h1{margin:0;font-size:19px;line-height:1.3}
  .top .sub{color:var(--muted);font-size:12px}
  .top .sp{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
  .content{padding:18px 20px 90px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .stack>*+*{margin-top:14px}
  h2{margin:0 0 10px;font-size:16px}
  h3{margin:0 0 6px;font-size:15px}
  .muted{color:var(--muted)} .small{font-size:13px}
  .btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);padding:6px 12px;font-size:13px;cursor:pointer;text-decoration:none;line-height:1.4}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .btn.plain{background:var(--soft);color:var(--ink)}
  .btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
  .seg button{border:0;background:transparent;padding:5px 12px;font-size:13px;cursor:pointer}
  .seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .bar .sp{flex:1}
  .cc{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted);background:var(--card)}
  .grade{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:0 6px;color:#fff;background:var(--c)}
  .grade.A{background:var(--a)} .grade.B{background:var(--b)}
  .pill{display:inline-block;font-size:12px;border-radius:999px;padding:0 9px;background:var(--soft);color:var(--ink)}
  .ex{display:inline-block;font-size:11px;border-radius:5px;padding:0 6px;background:var(--soft);color:var(--muted)}
  .due{font-size:12px;color:var(--muted)} .late{color:var(--bad);font-weight:700}
  input,select{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
  textarea{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:84px;resize:vertical}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gauto{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  @media (max-width:760px){.g2{grid-template-columns:1fr}}
  .ans{white-space:pre-wrap;background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
  .ans:empty{display:none}
  .empty{color:var(--muted);font-size:14px;padding:10px 0}
  .clk{cursor:pointer}
  .noai .ai-only{display:none}
  /* 채팅에 보낼 말 — 누르면 복사 */
  .say{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:3px 10px;font-size:14px;cursor:pointer;border:1px dashed transparent}
  .say:hover{border-color:var(--accent)}
  .say::before{content:"💬 "}
  .stepper{display:flex;gap:6px}
  .stepper div{flex:1;min-width:0;text-align:center;padding:8px 4px;border-radius:9px;background:var(--soft);color:var(--muted);font-size:13px}
  .stepper div b{display:block;font-size:12px}
  .stepper .done{background:var(--ok-soft);color:var(--ok)}
  .stepper .now{background:var(--accent);color:var(--accent-ink);font-weight:700}
  .hero{border:2px solid var(--accent);border-radius:14px;padding:18px 22px;background:var(--card)}
  .hero .k{font-size:13px;color:var(--accent);font-weight:700}
  .hero h2{font-size:20px;margin:4px 0 10px}
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;text-align:left}
  .tile:hover{border-color:var(--accent)}
  .tile b{display:block;font-size:26px;line-height:1.2}
  .tile span{font-size:13px;color:var(--muted)}
  ul.rows{list-style:none;margin:0;padding:0}
  ul.rows li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;padding:8px 0;border-top:1px solid var(--line)}
  ul.rows li:first-child{border-top:0}
  .board{display:grid;grid-template-columns:repeat(6,minmax(160px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
  .col{background:var(--soft);border-radius:10px;padding:8px;min-height:160px}
  .col h4{margin:2px 4px 8px;font-size:13px;display:flex;justify-content:space-between}
  .bc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;cursor:pointer}
  .bc:hover{border-color:var(--accent)}
  .bc b{display:block;font-size:14px;line-height:1.35;margin:2px 0}
  .bc .meta{font-size:12px;color:var(--muted)}
  table.tbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  table.tbl th{text-align:left;font-size:12px;color:var(--muted);background:var(--soft);padding:8px 10px;cursor:pointer;white-space:nowrap;user-select:none}
  table.tbl td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
  table.tbl tr.r:hover td{background:var(--accent-soft);cursor:pointer}
  .tw{overflow-x:auto}
  /* 바이어 상세 — 메뉴가 오른쪽이므로 왼쪽에서 열린다 */
  .shade{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:min(620px,100%);background:var(--bg);overflow-y:auto;z-index:21;transform:translateX(-100%);transition:transform .2s;box-shadow:8px 0 24px rgba(0,0,0,.18)}
  .dopen .shade{display:block} .dopen .drawer{transform:none}
  .dhead{position:sticky;top:0;background:var(--bg);padding:14px 18px 10px;border-bottom:1px solid var(--line);z-index:1}
  .dbody{padding:16px 18px 40px}
  .x{float:right;border:0;background:transparent;color:var(--muted);font-size:24px;cursor:pointer;line-height:1}
  table.kv{width:100%;border-collapse:collapse;font-size:14px}
  table.kv td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
  table.kv tr:first-child td{border-top:0}
  table.kv td:first-child{color:var(--muted);width:32%;white-space:nowrap}
  .tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
  .tl li{margin:0 0 9px;position:relative}
  .tl li::before{content:"";position:absolute;left:-20px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .tl .d{font-size:12px;color:var(--muted);margin-right:6px}
  .doc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px 30px;font-size:15px;line-height:1.75}
  .doc h1,.doc h2{font-size:22px;margin:0 0 12px}
  .doc h3{font-size:18px;margin:26px 0 8px;padding-top:8px;border-top:1px solid var(--line)}
  .doc h4,.doc h5{font-size:15px;margin:18px 0 6px}
  .doc table.md{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
  .doc table.md th,.doc table.md td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
  .doc table.md th{background:var(--soft)}
  .doc blockquote{margin:10px 0;padding:8px 14px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
  .doc code{background:var(--soft);border-radius:5px;padding:0 5px;font-size:13px}
  .toc a{display:block;font-size:13px;padding:4px 8px;border-left:2px solid var(--line);text-decoration:none;color:var(--muted)}
  .toc a:hover{color:var(--accent);border-left-color:var(--accent)}
  .rcard{cursor:pointer;display:flex;flex-direction:column;gap:6px}
  .rcard:hover{border-color:var(--accent)}
  .rcard p{margin:0;font-size:14px;color:var(--muted)}
  .fl{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
  .fl.folded{grid-template-columns:44px minmax(0,1fr)}
  @media (max-width:760px){.fl,.fl.folded{grid-template-columns:1fr}}
  .fl > .tree{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
  .tree.fold{padding:8px 6px}
  .sidehd{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px 8px}
  .tree button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:6px;border:0;background:transparent;color:inherit;text-align:left;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:14px}
  .tree button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
  .tree .foldbtn{width:28px;justify-content:center;padding:4px;color:var(--muted)}
  .tree .foldbtn:hover{background:var(--soft)}
  .tree .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tree .car{width:16px;flex:none;color:var(--muted);text-align:center}
  .ft{display:inline-block;width:38px;text-align:center;font-size:11px;font-weight:700;border-radius:5px;padding:1px 0;color:#fff;background:var(--c);margin-right:8px}
  .ft.pdf{background:#c2410c}.ft.xlsx,.ft.csv{background:#15803d}.ft.docx{background:#1d4ed8}.ft.md{background:#6b7280}.ft.html{background:#9333ea}.ft.jpg,.ft.png{background:#0e7490}
  .guide table{width:100%;border-collapse:collapse;font-size:14px}
  .guide td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
  .guide td:first-child{width:30%;color:var(--muted)}
  .fab{position:fixed;right:calc(var(--sw) + 16px);bottom:18px;z-index:15;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2)}
  .pop{position:fixed;right:calc(var(--sw) + 16px);bottom:74px;width:min(440px,calc(100% - var(--sw) - 32px));max-height:74vh;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;z-index:16;box-shadow:0 8px 28px rgba(0,0,0,.22);display:none}
  .pop.show{display:block}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:calc(100% - 36px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;text-align:center}
  #toast.show{opacity:1}
  /* 처음 할 일 — 폴더 상태를 보고 저절로 체크 */
  .quest{border:2px solid var(--accent)}
  .qbar{height:6px;background:var(--soft);border-radius:99px;margin:10px 0 4px;overflow:hidden}
  .qbar i{display:block;height:100%;background:var(--accent)}
  .qlist{list-style:none;margin:0;padding:0}
  .qlist li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:9px 0;border-top:1px solid var(--line)}
  .qlist li:first-child{border-top:0}
  .qlist li>div{flex:1;min-width:180px}
  .qk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .qlist li.ok{opacity:.55} .qlist li.ok .qk{background:var(--ok);border-color:var(--ok);color:#fff}
  .qlist li.next .qk{border-color:var(--accent)} .qlist li.next b{color:var(--accent)}
  .wmiss{padding:8px;border-top:1px dashed var(--line);font-size:14px}
  .wmiss .say{margin-top:4px;font-size:13px}
  .locbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 16px}
  .locbar code{background:var(--soft);border-radius:6px;padding:2px 8px;font-size:13px;word-break:break-all}
  @media (max-width:600px){.content{padding:14px 12px 90px}.top{padding:8px 12px}.tiles{grid-template-columns:1fr}.stepper div b{display:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand">
      <button class="tog" id="tog" title="메뉴 접기·펴기">≡</button>
      <span class="bt"><b id="brand"></b><small>AI Export Desk</small></span>
    </div>
    <ul class="nav" id="nav"></ul>
    <div class="foot">
      <button class="sidebtn" id="themebtn" title="화면 밝기"></button>
    </div>
  </aside>
  <div class="main">
    <div class="top">
      <div><h1 id="ttl"></h1><div class="sub" id="sub"></div></div>
      <div class="sp"></div>
      <span class="sub" id="upd"></span>
      <button class="iconbtn" id="refbtn" title="최신 내용 보기">↻ 새로고침</button>
      <button class="iconbtn" id="widebtn" title="넓게 보기">⤢ 넓게</button>
    </div>
    <div class="content" id="page"></div>
  </div>
</div>
<div id="dwrap"><div class="shade" data-close></div><aside class="drawer" id="drawer"></aside></div>
<button class="fab" id="fab">❓ 물어보기</button>
<section class="pop" id="ask">
  <button class="x" data-closeask>×</button>
  <h2>무엇이든 물어보세요</h2>
  <div class="small muted" id="askctx"></div>
  <div class="chips" id="quickq" style="margin:8px 0"></div>
  <textarea id="q" placeholder="예) 바이어가 FOB 가격을 달래요. 뭘 보내야 하나요?"></textarea>
  <div class="btns" style="margin-top:8px">
    <button class="btn ai-only" id="askgo">✨ 바로 답 받기</button>
    <button class="btn ghost" id="askchat">💬 채팅 AI에게 묻기(복사)</button>
  </div>
  <div class="ans" id="askans"></div>
</section>
<div id="toast" role="status" aria-live="polite"></div>

<script>
// 보기 전용 대시보드. 데이터 칸(#db)이 맨 아래에 있으므로 문서를 다 읽은 뒤 시작한다
document.addEventListener("DOMContentLoaded", function(){
  "use strict";
  function $(id){ return document.getElementById(id); }
  var DB = JSON.parse($("db").textContent);
  var SETUP = !!(DB.company && DB.company.trim());
  var STAGES = ["후보","연락함","답장 옴","샘플","협상","계약"];
  var FLOW = ["회사 정리","시장 고르기","바이어 찾기","연락·샘플","계약"];
  var CC = {"베트남":"VN","태국":"TH","인도네시아":"ID","말레이시아":"MY","싱가포르":"SG","필리핀":"PH","일본":"JP","중국":"CN","대만":"TW","홍콩":"HK","몽골":"MN","인도":"IN","아랍에미리트":"AE","사우디아라비아":"SA","미국":"US","캐나다":"CA","멕시코":"MX","호주":"AU","독일":"DE","영국":"GB"};
  // 장부 기본 칸 — 이 밖의 칸은 사용자가 추가한 칸으로 보여 준다
  var CORE = ["바이어ID","회사명","현지어 이름","나라","도시","유형","단계","등급","담당자","직함","이메일","전화","웹사이트","주소","특징","다음 할 일","다음 할 일 날짜","폴더","등록일","출처"];
  var PAGES = [
    {k:"home", ic:"🏠", t:"홈"},
    {k:"company", ic:"🏢", t:"우리 회사"},
    {k:"buyers", ic:"🤝", t:"바이어"},
    {k:"market", ic:"🌏", t:"시장조사"},
    {k:"files", ic:"📁", t:"자료"},
    {k:"guide", ic:"💬", t:"이렇게 말하세요"}
  ];
